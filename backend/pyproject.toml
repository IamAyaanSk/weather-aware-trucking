[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "httpx>=0.28.1",
    "polyline>=2.0.4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py315"
# Migrations are generated by Django and follow Django's own formatting.
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
# Keep Django's generated scaffold style consistent.
quote-style = "single"
